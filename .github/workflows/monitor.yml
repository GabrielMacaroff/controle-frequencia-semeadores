name: Monitoramento — Disponibilidade do MVP
on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  availability:
    name: Verificar site e banco — UP ou DOWN
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      SITE_URL: https://controle-frequencia-semeadores.macaroff.chatgpt.site
    steps:
      - name: Verificar disponibilidade pública e armazenamento
        shell: python
        run: |
          import json
          import os
          import time
          import urllib.request
          from datetime import datetime, timezone

          started = time.monotonic()
          base = os.environ['SITE_URL']
          state = 'DOWN'
          detail = 'Falha de disponibilidade'
          try:
              with urllib.request.urlopen(base + '/', timeout=20) as response:
                  page = response.read().decode('utf-8')
                  if response.status != 200 or 'Núcleo Semeadores do Bem' not in page:
                      raise RuntimeError('Interface pública não respondeu como esperado')
              with urllib.request.urlopen(base + '/api/health', timeout=20) as response:
                  data = json.load(response)
                  if response.status != 200 or data.get('status') != 'UP' or data.get('database') != 'UP':
                      raise RuntimeError('Banco ou serviço indisponível')
              state = 'UP'
              detail = 'Interface HTTP e banco D1 responderam com sucesso.'
          except Exception as error:
              detail = str(error)
          elapsed = round((time.monotonic() - started) * 1000)
          stamp = datetime.now(timezone.utc).isoformat()
          icon = '🟢' if state == 'UP' else '🔴'
          summary = f'# {icon} {state} — Monitoramento do MVP\n\nSite: {base}\n\nVerificado em: {stamp}\n\nTempo da verificação: {elapsed} ms\n\n{detail}\n\nExecução agendada aproximadamente a cada 30 minutos.\n'
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'w', encoding='utf-8') as file:
              file.write(summary)
          print(summary)
          if state != 'UP':
              raise SystemExit(1)
